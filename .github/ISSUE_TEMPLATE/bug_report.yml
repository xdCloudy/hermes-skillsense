name: Bug report
description: Report reproducible SkillSense behaviour once a testable implementation exists.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please redact tokens, personal prompts, private skills, file paths and identifying data. For security issues, use private reporting rather than this form."
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include safe, minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hermes / SkillSense versions
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised logs and tests
      description: Remove secrets before posting.