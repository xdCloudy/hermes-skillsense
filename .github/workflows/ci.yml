name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: skillsense-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.11' }
          - { os: windows-latest, python: '3.12' }
          - { os: windows-latest, python: '3.13' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q __init__.py core.py tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check project structure
        run: python tools/check_repo.py
      - name: Measure standalone BM25 overhead
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python tools/benchmark.py
          python tools/evaluate.py
