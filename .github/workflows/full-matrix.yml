name: Full cross-platform matrix
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  full-test-matrix:
    name: Full Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q __init__.py core.py tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check repository structure
        run: python tools/check_repo.py
