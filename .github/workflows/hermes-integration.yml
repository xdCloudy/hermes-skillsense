name: Hermes host integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hermes-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Hermes CLI in isolated ephemeral profile
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-skillsense-integration
          CI: "true"
        run: |
          curl --fail --silent --show-error --location \
            https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-install.sh
          bash /tmp/hermes-install.sh --non-interactive --skip-browser --skip-computer-use
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes plugins doctor . --ci
          hermes plugins validate .
      - name: Smoke-test installed plugin CLI and lifecycle
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-skillsense-integration
          CI: "true"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HERMES_HOME/plugins/skillsense"
          cp plugin.yaml ./*.py "$HERMES_HOME/plugins/skillsense/"
          hermes plugins enable skillsense

          FIXTURE="$HERMES_HOME/smoke-skills/android-re"
          mkdir -p "$FIXTURE"
          cat > "$FIXTURE/SKILL.md" <<'EOF'
          ---
          name: android-re
          description: Inspect and decompile Android APK archives
          metadata:
            hermes:
              tags: [apk, android, jadx]
          ---
          # Android reverse engineering
          ## When to Use
          Investigate Android app bytecode and APK decompilation.
          EOF

          hermes skillrouter status | grep -q "no catalogue"
          hermes skillrouter rebuild --root "$HERMES_HOME/smoke-skills" | grep -q "1 skills"
          hermes skillrouter status | grep -q "1 skills"
          hermes skillrouter clean --audit --dry-run --root "$HERMES_HOME/smoke-skills" | grep -q "no files or database changed"
          hermes skillrouter enable | grep -q "enabled"
          hermes skillrouter status | grep -q "enabled"
          hermes skillrouter disable | grep -q "disabled"
          hermes skillrouter status | grep -q "disabled"

          # The maintenance workflow must never rewrite the skill source.
          grep -q 'name: android-re' "$FIXTURE/SKILL.md"
          # Verify the actual Hermes skill catalogue is captured, not merely
          # that the plugin registered successfully.
          NATIVE="$HERMES_HOME/skills/catalogue-smoke"
          mkdir -p "$NATIVE"
          cat > "$NATIVE/SKILL.md" <<'EOF'
          ---
          name: catalogue-smoke
          description: Verify a native skill appears in local SkillSense routing
          ---
          # Catalogue smoke fixture
          ## When to Use
          Test Hermes native skill listing.
          EOF
          hermes skillrouter rebuild --root "$HERMES_HOME/skills" | grep -q "1 skills"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          home=Path(os.environ["HERMES_HOME"])
          snapshot=home/"plugin-data"/"skillsense"/"native-catalogue.json"
          assert snapshot.exists(), "SkillSense did not persist Hermes native skill list"
          info=json.loads(snapshot.read_text(encoding="utf-8"))
          assert "catalogue-smoke" in info.get("skills",{}), info
          sys.path.insert(0,str(home/"plugins"))
          from skillsense.routing import hint, clear_cache
          clear_cache()
          suggestion=hint("use catalogue-smoke to verify local skill routing")
          assert suggestion and "catalogue-smoke" in suggestion["context"], suggestion
          print("Verified native catalogue capture and local routing hint.")
          PY

          hermes skillrouter refresh-native | grep -q "Refreshed native availability"
          hermes skillrouter doctor | grep -q "eligible candidates"
          echo "SkillSense Hermes CLI smoke test passed."
