name: skillsense
version: 0.1.0
manifest_version: 2
api_version: 1
description: "SkillSense: local-first lightweight Hermes skill discovery (pre-alpha scaffold)"
author: xdCloudy
license: MIT
homepage: https://github.com/xdCloudy/hermes-skillsense
tags: [skills, bm25, skill-routing, offline-first, local, utility]
provides_hooks:
  - pre_llm_call
config_schema:
  enabled:
    type: bool
    default: false
    description: "Reserved for future skill hint injection; currently inactive."
  max_suggestions:
    type: int
    default: 3
    description: "Maximum future skill suggestions (1-3; currently inactive)."
